[project]
name = "saturn-gauss"
version = "1.0.0"
description = "Artilleur du futur : canon de Gauss orbitant Saturne, système solaire 3D simulé"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
saturn-gauss = "saturn_gauss.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: tests de bout en bout (quelques secondes)"]
